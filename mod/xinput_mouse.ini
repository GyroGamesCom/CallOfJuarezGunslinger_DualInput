[Mouse]
; 1 = mouse aim on, 0 = off.
Enabled=1
; In-game keys (0 = off; set a virtual-key code to enable, e.g. 80 = P):
;   P (80) = mouse aim on/off
;   O (79) = switch MouseMode 0 <-> 1 (saved)
;   K (75) = mouse slower by 10% (saved to Sensitivity below)
;   L (76) = mouse faster by 10% (saved to Sensitivity below)
ToggleKey=0
ModeKey=0
SlowerKey=0
FasterKey=0
; 0 = mouse goes through the pad's right stick (the game sees only the pad).
; 1 = mouse turns the camera natively (game's own mouse look, in-game mouse
;     sensitivity applies); mouse buttons still map to triggers.
MouseMode=0
; The right stick always wins: once it is pushed past this fraction (0-1),
; mouse movement is ignored until the stick returns to centre.
StickOverride=0.27
; Mouse speed in MouseMode 0. 1.0 = about 1000 mouse counts/s gives a fully pushed stick.
Sensitivity=0.3
; Extra multiplier for vertical aim.
SensitivityY=1.0
InvertY=1
; Response curve: 1.0 = linear, 0.7 = small moves stronger, 1.5 = small moves finer.
Curve=1.0
; Fraction of stick range added so small mouse moves get past the game's pad dead zone (0.0 - 0.3).
DeadzoneComp=0.10
; Mouse speed is averaged over this many milliseconds (5-200). Higher = steadier, lower = snappier.
SmoothingMs=30
; 1 = left mouse button -> right trigger (fire), right -> left trigger (aim),
; middle -> right bumper; the game then doesn't see these buttons itself.
MouseButtons=1
; 1 = mouse wheel still goes to the game natively, 0 = wheel ignored.
PassWheel=1

; 1 = while a game menu (main / pause) is open, the mouse goes to the game natively
; (cursor + clicks); in gameplay it goes through the pad as set above.
MenuMouse=1
